<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mobil Servis Yönetim</title><style>
body{font:15px system-ui;background:#f2f5f7;color:#182638;margin:0}.wrap{max-width:1100px;margin:auto;padding:22px}.panel{background:white;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 5px 22px #1020300d}h1{margin:0;color:#123b35}.muted{color:#657487}.row{display:flex;gap:10px;flex-wrap:wrap}input,select,button{padding:12px;border:1px solid #d5dfe5;border-radius:9px;font:inherit}input{min-width:220px}button{background:#126b55;color:white;border:0;font-weight:700;cursor:pointer}.danger{background:#8b3540}.card{border:1px solid #e1e8ed;border-radius:12px;padding:15px;margin:12px 0}.tag{font-size:12px;background:#e8f2ee;padding:5px 9px;border-radius:20px}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}small{color:#667}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}</style></head><body><div class="wrap"><h1>Mobil Araç Servisi</h1><p class="muted">Yönetici paneli · 0 (531) 309 27 67</p>
<section id="login" class="panel"><h2>Yönetici girişi</h2><div class="row"><input id="api" placeholder="API adresi (https://api.siteniz.com)" value="http://localhost:8080"><input id="email" type="email" placeholder="Yönetici e-postası"><input id="pass" type="password" placeholder="Parola"><button onclick="login()">Giriş yap</button></div><p id="msg" class="muted"></p></section>
<section id="dash" class="hidden"><div class="panel row" style="justify-content:space-between"><div><b>Servis talepleri</b><p class="muted">Yeni talepleri kontrol edin, ekibi yönlendirin ve durumları güncelleyin.</p></div><button onclick="load()">Yenile</button><button class="danger" onclick="logout()">Çıkış</button></div><div id="items"></div></section></div>
<script>
let token="";const $=id=>document.getElementById(id);const base=()=> $("api").value.replace(/\/$/,"");async function call(path,opts={}){let r=await fetch(base()+path,{...opts,headers:{"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{}),...(opts.headers||{})}});let j=await r.json();if(!r.ok)throw Error(j.error||"İşlem başarısız");return j}
async function login(){try{let x=await call("/admin/login",{method:"POST",body:JSON.stringify({email:$("email").value,password:$("pass").value})});token=x.token;$("login").classList.add("hidden");$("dash").classList.remove("hidden");load()}catch(e){$("msg").textContent=e.message}}
function logout(){token="";$("dash").classList.add("hidden");$("login").classList.remove("hidden")}
async function update(id){try{let status=document.getElementById("s"+id).value;let km=document.getElementById("k"+id).value;let note=document.getElementById("n"+id).value;await call("/admin/requests/"+id,{method:"PATCH",body:JSON.stringify({status,...(km!==""?{distanceKm:Number(km)}:{}),adminNote:note})});load()}catch(e){alert(e.message)}}
async function load(){try{let x=await call("/admin/requests");$("items").innerHTML=x.requests.map(r=>`<article class="card"><div class="row"><b>${esc(r.customer.firstName)} ${esc(r.customer.lastName)}</b><span class="tag">${esc(r.status)}</span></div><p><b>${esc(r.category)}</b> · ${esc(r.vehicle)} ${r.plate||""}</p><p>${esc(r.description)}</p><p>☎ <a href="tel:${esc(r.customer.phone)}">${esc(r.customer.phone)}</a></p><p>📍 ${esc(r.address)}</p>${r.latitude!=null&&r.longitude!=null?`<p><a target="_blank" href="https://www.google.com/maps?q=${r.latitude},${r.longitude}">Konumu haritada aç</a></p>`:""}<small>${new Date(r.createdAt).toLocaleString("tr-TR")}</small><div class="actions"><select id="s${r.id}">${["YENI","ONAYLANDI","EKIP_YOLDA","ISLEMDE","TAMAMLANDI","IPTAL_MUSTERI","IPTAL_SERVIS"].map(s=>`<option ${r.status===s?"selected":""}>${s}</option>`).join("")}</select><input id="k${r.id}" type="number" min="0" placeholder="Mesafe km" value="${r.distanceKm??""}"><input id="n${r.id}" placeholder="İç not" value="${esc(r.adminNote||"")}"><button onclick="update('${r.id}')">Kaydet</button></div><p><b>Hesaplanan yol bedeli:</b> ${r.travelFee??"Henüz girilmedi"} TL (30 TL/km)</p></article>`).join("")||"<div class=panel>Henüz servis talebi yok.</div>"}catch(e){alert(e.message)}}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
</script></body></html>
